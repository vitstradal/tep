# /etc/pikomat-zaloha.conf — konfigurace zálohy pikomatu (TOML)
# Čte ho /usr/local/sbin/pikomat-zaloha.py; neuvedené klíče mají
# defaulty přímo ve skriptu.

# Cíl záloh: kořenový disk (sdb1) — jiný fyzický disk než /home (md0).
zaloha_root = "/home/backup/pikomat"

min_volne_gb = 100      # tvrdá stopka, ať záloha nezaplní disk
uchovat_pg_dnu = 14     # kolik dní držet PG dumpy
uchovat_snap = 5        # kolik denních rsync snapshotů držet

# PG clustery (porty): 5432 = PG15 (tep_db, mattermost_db/klep,
# sklep_db/nextcloud, ...), 5435 = PG17.
clustery = [5432, 5435]

# Výběr databází: zalohuj_db neprázdný = dumpuj JEN tyto (whitelist);
# jinak platí blacklist nezalohuj_db. Seznam DB: pikomat-zaloha.py --list
# Stav :5432 (2026-08-30): sklep_db 25GB, tep_db 2GB, tep_dev_db 666MB,
# mattermost_db 240MB, postgres — zálohují se; mailman3, mailman3web,
# listmonk_db — vyřazené (mrtvé služby, v PG zůstávají).
zalohuj_db = []
nezalohuj_db = ["mailman3", "mailman3web", "listmonk_db"]

# rsync snapshoty s --link-dest (hardlinkové denní kopie)
[[snapshoty]]
nazev = "www"
zdroj = "/home/www"                       # 369 GB: sklep data, rails, overleaf, html
exclude = [
  "/rails/passenger-tmp",
  "/overleaf/data/mongo/journal",
]

[[snapshoty]]
nazev = "pikomat"
zdroj = "/home/pikomat"                   # 5 GB
