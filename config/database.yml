# SQLite version 3.x
#   gem install sqlite3

development:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: 'tep_user'
  password: <%= ENV['POSTGRES_PASSWORD']  %>
  host: localhost
  database: tep_dev_db

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.


# for running on localhost 
local:
  adapter: sqlite3
  database: var/db/local.sqlite3
  pool: 5
  timeout: 5000

void:
  adapter: sqlite3
  database: var/db/void.sqlite3
  pool: 5
  timeout: 5000


test:
  adapter: sqlite3
  database: var/db/test.sqlite3
  pool: 5
  timeout: 5000

production:
  adapter: sqlite3
  database: var/db/production.sqlite3
  pool: 5
  timeout: 5000
