---
defaults: &defaults
  tepmac:
    path: '/home/www/git/tepmac.git'
    bare: true
    url: 'tepmac'
    templates: 'tepmac'
    ext: '.wiki'
    help_link: 'wiki/tep/doc/wiki#start'
    read:   :org
    update: :morg
  main:
    path: '/home/www/git/web.git'
    bare: true
    url: ''
    ext: '.wiki'
    help_link: 'wiki/tep/doc/wiki#start'
    templates: 'tepmac'
    read:  :anon
    update: NULL
  piki:
    path: '/home/www/git/piki.git'
    bare: true
    url: 'piki'
    ext: '.wiki'
    help_link: 'wiki/tep/doc/wiki#start'
    templates: 'tepmac'
    read:  :org
    update: :org
  web_edit:
    path: '/home/www/git/web.git'
    bare: true
    url: 'webed'
    ext: '.wiki'
    help_link: 'wiki/tep/doc/wiki#start'
    templates: 'tepmac'
    read:  :org
    update: :morg
  data_edit:
    path: '/home/www/html/data'
    url: 'dataed'
    templates: 'tepmac'
    nogit: true
    ext: '.wiki'
    read:   :org
    update: :morg
  wikuk:
    url: 'wikuk'
    templates: 'tepmac'
    path: '/home/pikomat/wikuk'
    nogit: true
    ext: '.wiki'
    read:   :org
    update: :org

void: 
  main: &voidmain
    url: 'wikuk'
    templates: 'tepmac'
    path: 'tmp/void'
    nogit: true
    ext: '.wiki'
    read:   :org
    update: :org
  tepmac:
    <<: *voidmain
  piki:  
    <<: *voidmain
  web:  
    <<: *voidmain
  web_edit:
    <<: *voidmain

# testy renderují layout, který potřebuje wiki 'main' (wiki_main_path)
test:
  main:
    <<: *voidmain

development:
  <<: *defaults

production:
  <<: *defaults
